version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/LibHac.NSZ"
      - "/src/LibHac.NSZ.Test"
      - "/src/NxFileViewer"
      - "/src/NxFileViewer.Avalonia"
      - "/src/NxFileViewer.LogViewer.Avalonia"
      - "/src/NxFileViewer.Test"
    schedule:
      interval: "weekly"
    groups:
      per-package:
        group-by: "dependency-name"

  - package-ecosystem: "dotnet-sdk"
    directory: "/src"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
