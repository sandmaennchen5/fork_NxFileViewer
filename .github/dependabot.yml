version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/LibHac.NSZ"
      - "/src/LibHac.NSZ.Test"
      - "/src/NxFileViewer"
      - "/src/NxFileViewer.LogViewer"
      - "/src/NxFileViewer.Test"
    schedule:
      interval: "weekly"
    # Keep the framework-aligned packages on .NET 10, including patch updates.
    ignore:
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
    groups:
      per-package:
        group-by: "dependency-name"

  - package-ecosystem: "dotnet-sdk"
    directory: "/src"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
