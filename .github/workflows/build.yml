name: Build

on:
  push:
    branches: [ master, beta ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (win-x64 / win-x86)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: ./Publish.ps1

      - name: Upload application x64
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork_v*_x64.zip
            !Publish/NxFileViewerFork_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload application x64 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload application x86
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork_v*_x86.zip
            !Publish/NxFileViewerFork_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload application x86 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload legacy transition x64
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewer_v*_x64.zip
            !Publish/NxFileViewer_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload legacy transition x64 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewer_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload legacy transition x86
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewer_v*_x86.zip
            !Publish/NxFileViewer_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload legacy transition x86 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewer_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload LogViewer x64
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork.LogViewer_v*_x64.zip
            !Publish/NxFileViewerFork.LogViewer_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload LogViewer x64 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork.LogViewer_v*_self-contained_x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload LogViewer x86
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork.LogViewer_v*_x86.zip
            !Publish/NxFileViewerFork.LogViewer_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload LogViewer x86 with .NET
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/NxFileViewerFork.LogViewer_v*_self-contained_x86.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload firmware hashes ZIP
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/*_firmware-hashes.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload update release manifest
        uses: actions/upload-artifact@v7
        with:
          path: |
            Publish/nxfileviewer-update.json
          archive: false
          if-no-files-found: error
          retention-days: 7
