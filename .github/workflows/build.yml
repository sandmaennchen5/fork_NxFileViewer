name: Build

on:
  push:
    branches: [ master, beta ]

# Edit these targets here or in Publish.ps1 > GitHub workflows.
env:
  BUILD_TARGETS: |
    Windows arch win-x64
    Windows arch win-x86
    Windows arch win-arm64
    Windows zip with-net
    Windows zip without-net
    Linux arch linux-x64
    Linux arch linux-arm64
    ## Linux arch linux-arm
    Linux zip with-net
    Linux zip without-net
    Linux appimage with-net
    Linux appimage without-net
    macOS arch osx-x64
    macOS arch osx-arm64
    macOS zip with-net
    macOS zip without-net
    macOS app with-net
    macOS app without-net
    macOS dmg with-net
    macOS dmg without-net
    compatibility win40
    compatibility wpf41
    compatibility avalonia-beta1

jobs:
  targets:
    name: Select build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/Publish-WorkflowTargets.ps1
          $matrix = Get-WorkflowPublishMatrix $env:BUILD_TARGETS
          "matrix=$(ConvertTo-Json -InputObject $matrix -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT

  test:
    name: Test Viewer and LogViewer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Test default settings validation
        shell: powershell
        run: ./.github/scripts/Test-DefaultSettingsValidation.ps1
      - name: Test Viewer and LogViewer
        shell: pwsh
        working-directory: src
        run: dotnet run --project NxFileViewer.Test/NxFileViewer.Test.csproj -c Release
      - name: Create firmware-hashes.zip
        shell: pwsh
        run: |
          . ./tools/Publish-Output.ps1
          New-PublishFirmwareHashesZip $PWD.Path $env:RUNNER_TEMP (Join-Path $PWD.Path 'firmware-hashes.zip') | Out-Null
      - name: Upload firmware hashes
        uses: actions/upload-artifact@v7
        with:
          path: firmware-hashes.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Build packages (${{ matrix.platform }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Build portable Viewer and LogViewer ZIPs
        if: matrix.zipVariants[0] != null
        shell: pwsh
        env:
          BUILD_RUNTIMES: ${{ toJSON(matrix.runtimes) }}
          BUILD_VARIANTS: ${{ toJSON(matrix.zipVariants) }}
        run: |
          $runtimes = @($env:BUILD_RUNTIMES | ConvertFrom-Json)
          $variants = @($env:BUILD_VARIANTS | ConvertFrom-Json | ForEach-Object { $_ -eq 'with-net' })
          ./tools/Publish-Applications.ps1 -Framework Avalonia -Applications Viewer,LogViewer -RuntimeIdentifiers $runtimes -RuntimeVariants $variants -OutputDirectory Publish-Platform -SkipFirmwareHashes -NoCopy

      - name: Build Explorer packages
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          BUILD_RUNTIMES: ${{ toJSON(matrix.runtimes) }}
        run: |
          $architectures = @($env:BUILD_RUNTIMES | ConvertFrom-Json | Where-Object { $_ -in 'win-x64','win-arm64' } | ForEach-Object { $_.Substring(4) })
          if ($architectures.Count) {
              ./Publish.ps1 -OutputDirectory Publish-Platform -Extras Explorer -ExtraWindowsArchitectures $architectures
          }

      - name: Install appimagetool
        if: matrix.appImage
        shell: bash
        run: bash ./.github/scripts/Install-AppImageTool.sh

      - name: Build native Viewer and LogViewer packages
        if: matrix.nativePackages[0] != null
        shell: pwsh
        env:
          NATIVE_PACKAGES: ${{ toJSON(matrix.nativePackages) }}
        run: ./tools/Publish-WorkflowNativePackages.ps1 -PackagesJson $env:NATIVE_PACKAGES -OutputDirectory Publish-Platform

      - name: Generate update manifests
        if: matrix.zipVariants[0] != null
        shell: pwsh
        env:
          BUILD_COMPATIBILITY: ${{ toJSON(matrix.compatibilityExtras) }}
        run: |
          $extra = @('UpdateManifest') + @($env:BUILD_COMPATIBILITY | ConvertFrom-Json)
          ./Publish.ps1 -OutputDirectory Publish-Platform -Extras $extra

      - name: Create platform archive
        id: archive
        shell: pwsh
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = @{ Windows='win.zip'; Linux='linux.zip'; macOS='macos.zip' }[$env:BUILD_PLATFORM]
          $destination = Join-Path $PWD.Path $name
          $files = @(Get-ChildItem -LiteralPath Publish-Platform -File | Where-Object Extension -In @('.zip','.AppImage','.dmg','.json'))
          if (!$files.Count) { throw 'No platform packages were built.' }
          if ($IsWindows) {
              Compress-Archive -LiteralPath $files.FullName -DestinationPath $destination
          } else {
              # Store the already compressed packages and preserve AppImage execute permissions.
              $filePaths = @($files.FullName)
              & zip -0 -j $destination @filePaths
              if ($LASTEXITCODE -ne 0) { throw "Could not create $name." }
          }
          "path=$name" >> $env:GITHUB_OUTPUT

      - name: Upload platform archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.archive.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
