name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish tagged release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Validate release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v?(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta[0-9]*)?)$') {
              throw 'Expected a tag such as v4.2.0, v4.2.0-beta or v4.2.0-beta1 (v is optional).'
          }
          $version = $Matches['version']
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Prepare application version and changelog notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: ./.github/scripts/Prepare-Release.ps1 -Version $env:RELEASE_VERSION -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - name: Build release packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory Publish-Release

      - name: Create release with packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath Publish-Release -Filter '*.zip' -File | ForEach-Object FullName)
          if ($packages.Count -eq 0) { throw 'No release ZIPs were built.' }
          $descriptor = Get-Item -LiteralPath 'Publish-Release/nxfileviewer-update.json'
          $packages += $descriptor.FullName
          # Upload every package before making the release visible to updaters.
          gh release create $env:RELEASE_TAG --verify-tag --draft --notes-file "$env:RUNNER_TEMP/release-notes.md" --title "NxFileViewer Fork $env:RELEASE_VERSION" "--prerelease=$env:RELEASE_PRERELEASE" @packages
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release or uploading packages failed.' }
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$env:RELEASE_PRERELEASE"
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the prepared release failed.' }
