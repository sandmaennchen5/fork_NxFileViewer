name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v?(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta[0-9]*)?)$') {
              throw 'Expected a tag such as v4.2.0, v4.2.0-beta or v4.2.0-beta1 (v is optional).'
          }
          $version = $Matches['version']
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  avalonia:
    name: Avalonia (${{ matrix.platform }})
    needs: validate
    if: needs.validate.outputs.prerelease == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            runtimes: '["win-x64", "win-x86", "win-arm64"]'
          - platform: Linux
            os: ubuntu-latest
            runtimes: '["linux-x64", "linux-arm64"]'
          - platform: macOS
            os: macos-latest
            runtimes: '["osx-x64", "osx-arm64"]'
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Validate Linux launch scripts
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          sh -n tools/linux/start.sh.in
          sh -n tools/linux/install-shortcut.sh.in
      - name: Build Avalonia packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RUNTIMES: ${{ matrix.runtimes }}
        run: |
          $runtimes = @($env:RELEASE_RUNTIMES | ConvertFrom-Json)
          ./tools/Publish-Applications.ps1 -Framework Avalonia -Applications Viewer -Version $env:RELEASE_VERSION -OutputDirectory Publish-Avalonia -RuntimeIdentifiers $runtimes -SkipFirmwareHashes -AllTargets -NoCopy
      - name: Upload Avalonia packages
        uses: actions/upload-artifact@v7
        with:
          name: release-avalonia-${{ matrix.platform }}
          path: |
            Publish-Avalonia/*.zip
            Publish-Avalonia/*.avalonia.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tagged release
    needs: [validate, avalonia]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.avalonia.result == 'success' || needs.avalonia.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Test publish configuration
        shell: powershell
        run: ./.github/scripts/Test-PublishConfiguration.ps1
      - name: Test targeted publish selection
        shell: powershell
        run: ./.github/scripts/Test-PublishSelection.ps1
      - name: Test WPF packaging
        shell: powershell
        run: ./.github/scripts/Test-PublishWPF.ps1
      - name: Test Avalonia packaging
        shell: pwsh
        run: ./.github/scripts/Test-PublishAvalonia.ps1
      - name: Test Avalonia packaging in Windows PowerShell 5.1
        shell: powershell
        run: ./.github/scripts/Test-PublishAvalonia.ps1
      - name: Test release ZIP guide
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseAssetGuide.ps1
      - name: Prepare application version and changelog notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./.github/scripts/Prepare-Release.ps1 -Version $env:RELEASE_VERSION -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Build release packages
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory Publish-Release -ReleasePackages -SkipAvalonia -SkipLogViewer

      - name: Download Avalonia beta packages
        if: needs.validate.outputs.prerelease == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: release-avalonia-*
          path: Publish-Release
          merge-multiple: true

      - name: Verify Avalonia beta packages
        if: needs.validate.outputs.prerelease == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          foreach ($app in @('NxFileViewerFork')) {
              foreach ($platform in @('x64', 'x86', 'arm64', 'linux-x64', 'linux-arm64', 'osx-x64', 'osx-arm64')) {
                  foreach ($variant in @('', '_self-contained')) {
                      $name = "${app}_Avalonia_v$($env:RELEASE_VERSION)${variant}_${platform}.zip"
                      if (!(Test-Path -LiteralPath (Join-Path Publish-Release $name) -PathType Leaf)) {
                          throw "Missing Avalonia beta package: $name"
                      }
                      $markerPath = Join-Path Publish-Release ($name + '.avalonia.json')
                      $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
                      if ($marker.Framework -ne 'Avalonia' -or $marker.AssetName -ne $name -or $marker.Sha256 -ne (Get-FileHash -LiteralPath (Join-Path Publish-Release $name) -Algorithm SHA256).Hash) {
                          throw "Invalid Avalonia update checksum metadata: $name"
                      }
                  }
              }
          }

      - name: Verify WPF ARM64 packages
        shell: pwsh
        run: |
          $descriptor = Get-Content -LiteralPath Publish-Release/nxfileviewer-update.json -Raw | ConvertFrom-Json
          if (@($descriptor.Arm64Packages).Count -ne 2) { throw 'Expected both ARM64 viewer distributions.' }
          foreach ($package in $descriptor.Arm64Packages) {
              if ($package.Architecture -ne 'arm64' -or !(Test-Path -LiteralPath (Join-Path Publish-Release $package.AssetName))) {
                  throw 'Missing or invalid ARM64 viewer package.'
              }
          }


      - name: Append ZIP download guide
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./.github/scripts/Add-ReleaseAssetGuide.ps1 -Version $env:RELEASE_VERSION -PackageDirectory Publish-Release -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')

      - name: Create release with packages
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath Publish-Release -Filter '*.zip' -File | Where-Object Name -NotLike '*LogViewer*' | ForEach-Object FullName)
          if ($packages.Count -eq 0) { throw 'No release ZIPs were built.' }
          $descriptor = Get-Item -LiteralPath 'Publish-Release/nxfileviewer-update.json'
          $packages += $descriptor.FullName
          & ./.github/scripts/New-ReleasePackageIndex.ps1 -PackageDirectory Publish-Release
          $packages += (Get-Item -LiteralPath 'Publish-Release/nxfileviewer-packages.json').FullName
          # Upload every package before making the release visible to updaters.
          gh release create $env:RELEASE_TAG --verify-tag --draft --notes-file "$env:RUNNER_TEMP/release-notes.md" --title "NxFileViewer Fork $env:RELEASE_VERSION" "--prerelease=$env:RELEASE_PRERELEASE" @packages
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release or uploading packages failed.' }
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$env:RELEASE_PRERELEASE"
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the prepared release failed.' }

  notify-discord:
    needs: release
    uses: ./.github/workflows/discord-release.yml
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_PRERELEASE_WEBHOOK: ${{ secrets.DISCORD_PRERELEASE_WEBHOOK }}
