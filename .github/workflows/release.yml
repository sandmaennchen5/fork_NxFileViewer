name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

# Each line selects one platform, file format and .NET variant. Use ## to disable it.
env:
  RELEASE_TARGETS: |
    Windows arch win-x64
    Windows arch win-x86
    Windows arch win-arm64
    Windows zip with-net
    Windows zip without-net
    ## Linux arch linux-x64
    ## Linux arch linux-arm64
    ## Linux arch linux-arm
    ## Linux zip with-net
    ## Linux zip without-net
    ## Linux appimage with-net
    ## Linux appimage without-net
    ## macOS arch osx-x64
    ## macOS arch osx-arm64
    ## macOS zip with-net
    ## macOS zip without-net
    ## macOS app with-net
    ## macOS app without-net
    ## macOS dmg with-net
    ## macOS dmg without-net
    compatibility win40
    compatibility wpf41
    compatibility avalonia-beta1
  PRERELEASE_TARGETS: |
    Windows arch win-x64
    Windows arch win-x86
    Windows arch win-arm64
    Windows zip with-net
    Windows zip without-net
    Linux arch linux-x64
    Linux arch linux-arm64
    ## Linux arch linux-arm
    Linux zip with-net
    Linux zip without-net
    Linux appimage with-net
    Linux appimage without-net
    macOS arch osx-x64
    macOS arch osx-arm64
    macOS zip with-net
    macOS zip without-net
    macOS app with-net
    macOS app without-net
    macOS dmg with-net
    macOS dmg without-net
    compatibility win40
    compatibility wpf41
    compatibility avalonia-beta1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v?(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta[0-9]*)?)$') {
              throw 'Expected a tag such as v4.2.0, v4.2.0-beta or v4.2.0-beta1 (v is optional).'
          }
          $version = $Matches['version']
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

          $selection = if ($prerelease -eq 'true') { $env:PRERELEASE_TARGETS } else { $env:RELEASE_TARGETS }
          . ./tools/Publish-WorkflowTargets.ps1
          "matrix=$(Get-WorkflowPublishMatrix $selection | ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT

  avalonia:
    name: Avalonia (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - name: Validate Linux launch scripts
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          sh -n tools/linux/start.sh.in
      - name: Build Avalonia packages
        if: matrix.zipVariants[0] != null
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RUNTIMES: ${{ toJSON(matrix.runtimes) }}
          RELEASE_VARIANTS: ${{ toJSON(matrix.zipVariants) }}
        run: |
          $runtimes = @($env:RELEASE_RUNTIMES | ConvertFrom-Json)
          $variants = @($env:RELEASE_VARIANTS | ConvertFrom-Json | ForEach-Object { $_ -eq 'with-net' })
          ./tools/Publish-Applications.ps1 -Framework Avalonia -Applications Viewer -Version $env:RELEASE_VERSION -OutputDirectory Publish-Avalonia -RuntimeIdentifiers $runtimes -RuntimeVariants $variants -SkipFirmwareHashes:(!$IsWindows) -AllTargets -NoCopy
      - name: Upload Avalonia packages
        if: matrix.zipVariants[0] != null
        uses: actions/upload-artifact@v7
        with:
          name: release-avalonia-${{ matrix.platform }}
          path: |
            Publish-Avalonia/*.zip
            Publish-Avalonia/*.viewer.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Install appimagetool
        if: matrix.appImage
        shell: bash
        run: bash ./.github/scripts/Install-AppImageTool.sh

      - name: Build native Avalonia packages
        if: matrix.nativePackages[0] != null
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NATIVE_PACKAGES: ${{ toJSON(matrix.nativePackages) }}
        run: ./tools/Publish-WorkflowNativePackages.ps1 -PackagesJson $env:NATIVE_PACKAGES -Applications Viewer -Version $env:RELEASE_VERSION -OutputDirectory Publish-Native

      - name: Upload native Avalonia packages
        if: matrix.nativePackages[0] != null
        uses: actions/upload-artifact@v7
        with:
          name: release-avalonia-${{ matrix.platform }}-native
          path: |
            Publish-Native/*.AppImage
            Publish-Native/*.AppImage.zip
            Publish-Native/*.app.zip
            Publish-Native/*.dmg
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  release:
    name: Publish tagged release
    outputs:
      published: ${{ steps.publish.outputs.published }}
    needs: [validate, avalonia]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.avalonia.result == 'success' || needs.validate.outputs.prerelease == 'true') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Test publish configuration
        shell: powershell
        run: ./.github/scripts/Test-PublishConfiguration.ps1
      - name: Test targeted publish selection
        shell: powershell
        run: ./.github/scripts/Test-PublishSelection.ps1
      - name: Test Avalonia packaging
        shell: pwsh
        run: ./.github/scripts/Test-PublishAvalonia.ps1
      - name: Test Avalonia packaging in Windows PowerShell 5.1
        shell: powershell
        run: ./.github/scripts/Test-PublishAvalonia.ps1
      - name: Test release ZIP guide
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseAssetGuide.ps1
      - name: Prepare application version and changelog notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./.github/scripts/Prepare-Release.ps1 -Version $env:RELEASE_VERSION -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Download successful Avalonia builds
        uses: actions/download-artifact@v8
        with:
          pattern: release-avalonia-*
          path: Publish-Release
          merge-multiple: true

      - name: Publish available packages
        id: publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_MATRIX: ${{ needs.validate.outputs.matrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releasePages = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check for an existing release.' }
          $existing = foreach ($page in ($releasePages | ConvertFrom-Json -NoEnumerate)) {
              foreach ($release in $page) {
                  if ($release.tag_name -ceq $env:RELEASE_TAG) { $release }
              }
          }
          $existingPackageNames = @($existing.assets | Where-Object { $_.name -notlike 'NxFileViewerFork.LogViewer_*' -and [IO.Path]::GetExtension($_.name) -in @('.zip','.AppImage','.dmg') } | ForEach-Object name)
          if ($existing) {
              if ($existing.immutable) { throw 'This release is immutable and cannot accept additional packages.' }
              if ($existingPackageNames.Count) {
                  $patterns = @($existingPackageNames | ForEach-Object { "--pattern=$_" })
                  gh release download $env:RELEASE_TAG --dir Publish-Release --clobber @patterns
                  if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the existing release packages.' }
              }
          }

          $version = [regex]::Escape($env:RELEASE_VERSION)
          $explorerArchitectures = @()
          $groups = ($env:RELEASE_MATRIX | ConvertFrom-Json).include
          $hasUpdateZips = $false
          $platformCount = 0
          foreach ($group in $groups) {
              $nativeExpected = @(foreach ($package in $group.nativePackages) {
                  foreach ($rid in $package.runtimes) {
                      foreach ($variant in $package.variants) {
                          $name = "NxFileViewerFork_v$($env:RELEASE_VERSION)_$rid-$variant"
                          switch ($package.format) {
                              AppImage { "$name.AppImage"; "$name.AppImage.zip" }
                              App { "$name.app.zip" }
                              Dmg { "$name.dmg" }
                          }
                      }
                  }
              })
              $nativeAvailable = @($nativeExpected | Where-Object { Test-Path -LiteralPath (Join-Path Publish-Release $_) -PathType Leaf })
              if ($nativeAvailable.Count -ne $nativeExpected.Count -and ($env:RELEASE_PRERELEASE -ne 'true' -or $nativeAvailable.Count)) {
                  throw "Incomplete $($group.platform) native packages."
              }
              if ($nativeAvailable.Count) { $platformCount++ }
              if (!$group.zipVariants.Count) { continue }
              $expected = @(foreach ($rid in $group.runtimes) {
                  foreach ($variant in $group.zipVariants) {
                      "NxFileViewerFork_v$($env:RELEASE_VERSION)_$rid-$variant.zip"
                  }
              })
              $available = @($expected | Where-Object { Test-Path -LiteralPath (Join-Path Publish-Release $_) -PathType Leaf })
              if (!$available.Count -and $env:RELEASE_PRERELEASE -eq 'true') {
                  Write-Warning "$($group.platform) build unavailable. Its packages can be added by re-running the job."
                  continue
              }
              if ($available.Count -ne $expected.Count) { throw "Incomplete $($group.platform) packages." }
              foreach ($name in $available) {
                  if ($name -cin $existingPackageNames) { continue }
                  $path = Join-Path Publish-Release $name
                  $marker = Get-Content -LiteralPath "$path.viewer.json" -Raw | ConvertFrom-Json
                  if ($marker.Framework -ne 'Avalonia' -or $marker.AssetName -cne $name -or $marker.Sha256 -ne (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash) {
                      throw "Invalid Avalonia update checksum metadata: $name"
                  }
              }
              $platformCount++
              $hasUpdateZips = $true
              if ($group.platform -eq 'Windows') {
                  $explorerArchitectures = @($group.runtimes | Where-Object { $_ -in @('win-x64','win-arm64') } | ForEach-Object { $_.Substring(4) })
              }
          }
          if (!$platformCount) { throw 'No platform completed successfully.' }

          if ($explorerArchitectures.Count) {
              $explorer = @(Get-ChildItem -LiteralPath Publish-Release -Filter 'NxFileViewerFork.Explo?er_*.zip' -File)
              $missing = @($explorerArchitectures | Where-Object { !($explorer.Name -like "*_win-$_.zip") })
              if ($missing.Count) {
                  ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory Publish-Release -Extras Explorer -ExtraWindowsArchitectures $missing
              }
          }
          if ($hasUpdateZips) {
              $extra = @('UpdateManifest') + @($groups[0].compatibilityExtras)
              ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory Publish-Release -Extras $extra
              $descriptor = Get-Content -LiteralPath Publish-Release/nxfileviewer-update.json -Raw | ConvertFrom-Json
              $index = Get-Content -LiteralPath Publish-Release/nxfileviewer-packages.json -Raw | ConvertFrom-Json
              $avalonia = @(Get-ChildItem -LiteralPath Publish-Release -File | Where-Object Name -Match "^NxFileViewerFork_v${version}_(?:win|linux|osx)-.*-net\.zip$")
              if (@($descriptor.AvaloniaPackages).Count -ne $avalonia.Count) { throw 'Missing Avalonia manifest entries.' }
              foreach ($zip in $avalonia) {
                  $item = @($descriptor.AvaloniaPackages | Where-Object AssetName -eq $zip.Name)
                  $entry = @($index.Packages | Where-Object AssetName -eq $zip.Name)
                  if ($item.Count -ne 1 -or $entry.Count -ne 1 -or $item[0].Sha256 -ne $entry[0].Sha256) {
                      throw "Avalonia metadata mismatch: $($zip.Name)"
                  }
              }

              ./.github/scripts/Add-ReleaseAssetGuide.ps1 -Version $env:RELEASE_VERSION -PackageDirectory Publish-Release -NotesPath (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          }
          if (!$hasUpdateZips) {
              ./Publish.ps1 -Version $env:RELEASE_VERSION -OutputDirectory Publish-Release -Extras UpdateManifest
          }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $packages = @(Get-ChildItem -LiteralPath Publish-Release -File | Where-Object { ($_.Extension -in @('.zip','.AppImage','.dmg')) -and $_.Name -cnotin $existingPackageNames } | ForEach-Object FullName)
          $metadata = @(Get-Item -LiteralPath 'Publish-Release/nxfileviewer-update.json','Publish-Release/nxfileviewer-packages.json' | ForEach-Object FullName)
          if (!$existing) {
              gh release create $env:RELEASE_TAG --verify-tag --draft --notes-file $notes --title "NxFileViewer Fork $env:RELEASE_VERSION" "--prerelease=$env:RELEASE_PRERELEASE" @packages @metadata
              if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release or uploading packages failed.' }
          } else {
              if ($packages.Count) {
                  gh release upload $env:RELEASE_TAG @packages
                  if ($LASTEXITCODE -ne 0) { throw 'Uploading additional packages failed.' }
              }
              if ($metadata.Count) {
                  gh release upload $env:RELEASE_TAG @metadata --clobber
                  if ($LASTEXITCODE -ne 0) { throw 'Updating release metadata failed.' }
              }
          }
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$env:RELEASE_PRERELEASE" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Publishing or updating the release failed.' }
          if (!$existing -or $existing.draft) { "published=true" >> $env:GITHUB_OUTPUT }

  notify-discord:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.published == 'true' }}
    uses: ./.github/workflows/discord-release.yml
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_PRERELEASE_WEBHOOK: ${{ secrets.DISCORD_PRERELEASE_WEBHOOK }}
