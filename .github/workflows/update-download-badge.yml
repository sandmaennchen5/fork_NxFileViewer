name: Update Download Badge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-download-badge.yml
      - .github/scripts/update_download_badge.py
      - .github/scripts/test_update_download_badge.py

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test viewer filtering and failure handling
        run: python -B -m unittest discover -s .github/scripts -p 'test_update_download_badge.py'

      - name: Generate viewer download count
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          FORGEJO_URL: "https://git.sandmaennchen5.de/"
          FORGEJO_OWNER: "sandmaennchen5"
          FORGEJO_REPO: "fork_NxFileViewer"
        run: python -B .github/scripts/update_download_badge.py

      - name: Commit badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update viewer download badge"
            # Retain unrelated pushes made while counting; never force-push.
            git pull --rebase origin master
            git push origin HEAD:master
          fi
